<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulador ICFES Saber 11°</title>
  <meta name="description" content="Simulador ICFES Saber 11° en HTML, CSS y JavaScript puro, estructurado por sesiones, bloques y áreas." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">IC</div>
        <div>
          <p class="eyebrow">Simulador académico</p>
          <h1>ICFES Saber 11°</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Cambiar tema">🌙</button>
        <button id="homeBtn" class="ghost-btn hidden" type="button">Inicio</button>
      </div>
    </header>

    <main id="app" class="app-main" tabindex="-1"></main>
  </div>

  <template id="session-card-template">
    <article class="session-card">
      <div class="session-card__head">
        <div>
          <p class="eyebrow session-label"></p>
          <h2 class="session-title"></h2>
        </div>
        <span class="pill session-duration"></span>
      </div>
      <p class="session-description"></p>
      <div class="session-stats"></div>
      <div class="table-wrap">
        <table class="structure-table">
          <thead>
            <tr>
              <th>Bloque</th>
              <th>Preguntas</th>
              <th>Área</th>
              <th>Cargadas</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="session-actions"></div>
    </article>
  </template>

  <script src="data/question-bank.js"></script>
  <script src="app.js"></script>
</body>
</html>
